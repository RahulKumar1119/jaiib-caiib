version: 1
backend:
  phases:
    build:
      commands:
        - echo "Backend is managed by AWS CDK, skipping Amplify backend build"
frontend:
  phases:
    install:
      commands:
        - cd frontend
        - npm install
    build:
      commands:
        - cd frontend
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - 'frontend/node_modules/**/*'
