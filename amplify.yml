version: 1
backend:
  phases:
    build:
      commands:
        - echo "Backend is managed by AWS CDK, skipping Amplify backend build"
frontend:
  phases:
    install:
      commands:
        - cd frontend
        - npm install --legacy-peer-deps
    build:
      commands:
        - cd frontend
        - npm run build
        - mkdir -p dist
        - cp -r public/* dist/ 2>/dev/null || true
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - 'frontend/node_modules/**/*'
