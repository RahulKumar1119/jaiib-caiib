version: 1
backend:
  phases:
    build:
      commands:
        - echo "Backend is managed by AWS CDK, skipping Amplify backend build"
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm install --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/.next
    files:
      - '**/*'
  cache:
    paths:
      - 'frontend/node_modules/**/*'
