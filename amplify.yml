version: 1
backend:
  phases:
    build:
      commands:
        - echo "Backend is managed by AWS CDK, skipping Amplify backend build"
frontend:
  phases:
    preBuild:
      commands:
        - bash -c "cd frontend && npm install"
    build:
      commands:
        - bash -c "cd frontend && npm run build"
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - 'frontend/node_modules/**/*'
